name: Windows diagnostic preview

on:
  workflow_dispatch:
  push:
    branches:
      - codex/diagnostic-windows-preview

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, test and package standalone diagnostic tool
        shell: powershell
        run: .\scripts\build-windows-diagnostic-preview.ps1
      - name: Upload standalone diagnostic preview
        uses: actions/upload-artifact@v4
        with:
          name: scpefe-diagnostic-win-x64-unsigned
          path: |
            build/windows-diagnostic-preview/scpefe-diagnostic-win-x64.zip
            build/windows-diagnostic-preview/scpefe-diagnostic-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
